[project]
name = "packgen"
version = "0.6.0"
description = "Particle packing generator"
keywords = [
  "blender",
  "bpy",
  "particle packing",
  "packing generator",
  "simulation",
]
readme = "README.md"
authors = [
  { name = "Fábio P. Fortkamp", email = "fabio@fabiofortkamp.com" },
  { name = "Andrea R. Insinga", email = "aroin@dtu.dk" },
  { name = "Andreas Papanikolaou", email = "s232477@student.dtu.dk" },
]
requires-python = ">=3.11, <3.12"
dependencies = ["bpy>=4.4.0", "numpy < 2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]
license = { file = "LICENSE" }

[project.scripts]
packgen = "packgen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "basedpyright>=1.31.3",
  "pytest-cov>=7.0.0",
  "pytest>=8.3.5",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
markers = [
  "blender: tests that require a local Blender executable",
  "slow: tests that are too slow for the default unit-test loop",
]

[tool.ruff.lint]
extend-select = [
  "ANN", # annotations
  "FBT", # boolean trap
  "B",
  "A",
  "C",
  "D",
]

extend-ignore = [
  "ANN401", # for now, we have to rely on "Any" types
]
[tool.basedpyright]
typeCheckingMode = "basic"
allowedUntypedLibraries = ["bpy"]

[tool.coverage.run]
source = ["packgen"]
omit = [
  "src/packgen/blend.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
